<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="laboratory charts — animated avatar">
  <defs>
    <radialGradient id="avlab_bg" cx="28%" cy="30%" r="110%">
      <stop offset="0%" stop-color="#141433"/>
      <stop offset="55%" stop-color="#0a0a1f"/>
      <stop offset="100%" stop-color="#04040c"/>
    </radialGradient>
    <linearGradient id="avlab_main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"><animate attributeName="stop-color" values="#22d3ee;#a78bfa;#00ffa3;#22d3ee;#a78bfa;#22d3ee" dur="11s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#a78bfa"><animate attributeName="stop-color" values="#a78bfa;#a78bfa;#22d3ee;#a78bfa" dur="13s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="avlab_sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="avlab_orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="avlab_glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="avlab_soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#avlab_bg)"/>
  <circle cx="64" cy="64" r="52" fill="url(#avlab_orb)"><animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="64" r="46" fill="none" stroke="url(#avlab_main)" stroke-width="3.0" stroke-linecap="round" stroke-dasharray="193 101" filter="url(#avlab_glow)"><animateTransform attributeName="transform" type="rotate" from="0 64 64" to="360 64 64" dur="11.0s" repeatCount="indefinite"/></circle>
  <g transform="translate(64,64) scale(0.62)">
    <g><rect x="-46" y="-30" width="52" height="42" rx="5" fill="#05060f" stroke="#a78bfa" stroke-width="2.4"/><path d="M-42,6 l12,-16 9,11 7,-8 12,17 Z" fill="#a78bfa" opacity="0.7"/><circle cx="-14" cy="-20" r="5" fill="#22d3ee"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite"/></circle></g><g><rect x="-8" y="-40" width="56" height="46" rx="5" fill="#05060f" stroke="#22d3ee" stroke-width="2.4" filter="url(#avlab_glow)"/><path d="M-4,0 l14,-20 10,13 8,-9 14,20 Z" fill="#22d3ee" opacity="0.75"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="3.4s" repeatCount="indefinite"/></path><circle cx="30" cy="-28" r="5.5" fill="#f472b6"><animate attributeName="r" values="4.5;6.5;4.5" dur="2.2s" repeatCount="indefinite"/></circle></g>
  </g>
  <g clip-path="none"><rect x="-260" y="0" width="200" height="128" fill="url(#avlab_sweep)" transform="skewX(-18)"><animate attributeName="x" values="-260;248" dur="6.0s" begin="0s" repeatCount="indefinite"/></rect></g>
  <rect x="1" y="1" width="126" height="126" rx="29" fill="none" stroke="url(#avlab_main)" stroke-width="1.6">
    <animate attributeName="stroke" values="#22d3ee;#a78bfa;#f472b6;#22d3ee;#22d3ee" dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>
