      <stop offset="0%" stop-color="#141433"/>
      <stop offset="55%" stop-color="#0a0a1f"/>
      <stop offset="100%" stop-color="#04040c"/>
    </radialGradient>
    <linearGradient id="avsc_hmain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"><animate attributeName="stop-color" values="#fbbf24;#f472b6;#00ffa3;#22d3ee;#a78bfa;#fbbf24" dur="11s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#f472b6"><animate attributeName="stop-color" values="#f472b6;#a78bfa;#fbbf24;#f472b6" dur="13s" repeatCount="indefinite"/></stop>
    </linearGradient>
