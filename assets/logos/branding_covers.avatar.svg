<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="branding covers — animated avatar">
  <defs>
    <radialGradient id="avbranbg" cx="28%" cy="30%" r="110%">
      <stop offset="0%" stop-color="#141433"/>
      <stop offset="55%" stop-color="#0a0a1f"/>
      <stop offset="100%" stop-color="#04040c"/>
    </radialGradient>
    <linearGradient id="avbranmain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"><animate attributeName="stop-color" values="#fb923c;#a78bfa;#00ffa3;#22d3ee;#a78bfa;#fb923c" dur="11s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#a78bfa"><animate attributeName="stop-color" values="#a78bfa;#a78bfa;#fb923c;#a78bfa" dur="13s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="avbransweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="avbranorb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#fb923c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <filter id="avbranglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="avbransoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#avbranbg)"/>
  <circle cx="64" cy="64" r="52" fill="url(#avbranorb)"><animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="64" r="46" fill="none" stroke="url(#avbranmain)" stroke-width="3.0" stroke-linecap="round" stroke-dasharray="193 101" filter="url(#avbranglow)"><animateTransform attributeName="transform" type="rotate" from="0 64 64" to="360 64 64" dur="11.0s" repeatCount="indefinite"/></circle>
  <g transform="translate(64,64) scale(0.62)">
    <g><rect x="-43.0" y="-24" width="76" height="18" rx="3" fill="#fb923c" opacity="0.85"><animate attributeName="opacity" values="0.6;0.95;0.6" dur="3s" repeatCount="indefinite"/></rect><rect x="-43.0" y="-24" width="7" height="18" rx="3" fill="#05060f" opacity="0.5"/></g><g><rect x="-29.0" y="-2" width="68" height="18" rx="3" fill="#a78bfa" opacity="0.85"><animate attributeName="opacity" values="0.6;0.95;0.6" dur="4s" repeatCount="indefinite"/></rect><rect x="-29.0" y="-2" width="7" height="18" rx="3" fill="#05060f" opacity="0.5"/></g><g><rect x="-30.0" y="22" width="60" height="18" rx="3" fill="#a78bfa" opacity="0.85"><animate attributeName="opacity" values="0.6;0.95;0.6" dur="5s" repeatCount="indefinite"/></rect><rect x="-30.0" y="22" width="7" height="18" rx="3" fill="#05060f" opacity="0.5"/></g><rect x="16" y="-40" width="10" height="16" rx="2" fill="#a78bfa"><animate attributeName="y" values="-40;-28;-40" dur="3.4s" repeatCount="indefinite"/></rect><rect x="-38" y="-44" width="76" height="14" rx="4" fill="none" stroke="#fb923c" stroke-width="2" opacity="0.8"/>
  </g>
  <g clip-path="none"><rect x="-260" y="0" width="200" height="128" fill="url(#avbransweep)" transform="skewX(-18)"><animate attributeName="x" values="-260;248" dur="6.0s" begin="0s" repeatCount="indefinite"/></rect></g>
  <rect x="1" y="1" width="126" height="126" rx="29" fill="none" stroke="url(#avbranmain)" stroke-width="1.6">
    <animate attributeName="stroke" values="#fb923c;#a78bfa;#f472b6;#fb923c;#fb923c" dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>
