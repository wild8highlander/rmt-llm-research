<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="laboratory charts 3D — animated avatar">
  <defs>
    <radialGradient id="avlab_bg" cx="28%" cy="30%" r="110%">
      <stop offset="0%" stop-color="#141433"/>
      <stop offset="55%" stop-color="#0a0a1f"/>
      <stop offset="100%" stop-color="#04040c"/>
    </radialGradient>
    <linearGradient id="avlab_main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"><animate attributeName="stop-color" values="#a78bfa;#00ffa3;#00ffa3;#22d3ee;#a78bfa;#a78bfa" dur="11s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#00ffa3"><animate attributeName="stop-color" values="#00ffa3;#a78bfa;#a78bfa;#00ffa3" dur="13s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="avlab_sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="avlab_orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#a78bfa" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="avlab_glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="avlab_soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#avlab_bg)"/>
  <circle cx="64" cy="64" r="52" fill="url(#avlab_orb)"><animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="64" r="46" fill="none" stroke="url(#avlab_main)" stroke-width="3.0" stroke-linecap="round" stroke-dasharray="193 101" filter="url(#avlab_glow)"><animateTransform attributeName="transform" type="rotate" from="0 64 64" to="360 64 64" dur="11.0s" repeatCount="indefinite"/></circle>
  <g transform="translate(64,64) scale(0.62)">
    <g><animateTransform attributeName="transform" type="rotate" values="-4 0 0;4 0 0;-4 0 0" dur="6s" repeatCount="indefinite"/><path d="M0,-40 L36,-20 L36,20 L0,40 L-36,20 L-36,-20 Z" fill="none" stroke="url(#avlab_main)" stroke-width="2.8" filter="url(#avlab_glow)"/><path d="M0,-40 L0,0 M0,0 L36,20 M0,0 L-36,20 M-36,-20 L0,0 L36,-20" fill="none" stroke="#00ffa3" stroke-width="1.8" opacity="0.85"/><path d="M0,-40 L36,-20 M-36,-20 L-36,20 M36,-20 L36,20" fill="none" stroke="#a78bfa" stroke-width="1.8" opacity="0.85"/></g><circle r="3.4" fill="#22d3ee" filter="url(#avlab_glow)"><animateMotion dur="5s" repeatCount="indefinite" path="M-36,-20 L0,-40 L36,-20 L36,20 L0,40 L-36,20 Z"/></circle>
  </g>
  <g clip-path="none"><rect x="-260" y="0" width="200" height="128" fill="url(#avlab_sweep)" transform="skewX(-18)"><animate attributeName="x" values="-260;248" dur="6.0s" begin="0s" repeatCount="indefinite"/></rect></g>
  <rect x="1" y="1" width="126" height="126" rx="29" fill="none" stroke="url(#avlab_main)" stroke-width="1.6">
    <animate attributeName="stroke" values="#a78bfa;#00ffa3;#f472b6;#a78bfa;#a78bfa" dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>
