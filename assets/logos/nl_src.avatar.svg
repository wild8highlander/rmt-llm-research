<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="neural_lab/src — animated avatar">
  <defs>
    <radialGradient id="avnl_sbg" cx="28%" cy="30%" r="110%">
      <stop offset="0%" stop-color="#141433"/>
      <stop offset="55%" stop-color="#0a0a1f"/>
      <stop offset="100%" stop-color="#04040c"/>
    </radialGradient>
    <linearGradient id="avnl_smain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"><animate attributeName="stop-color" values="#60a5fa;#22d3ee;#00ffa3;#22d3ee;#a78bfa;#60a5fa" dur="11s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#22d3ee"><animate attributeName="stop-color" values="#22d3ee;#a78bfa;#60a5fa;#22d3ee" dur="13s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="avnl_ssweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="avnl_sorb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#60a5fa" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <filter id="avnl_sglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="avnl_ssoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#avnl_sbg)"/>
  <circle cx="64" cy="64" r="52" fill="url(#avnl_sorb)"><animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="64" r="46" fill="none" stroke="url(#avnl_smain)" stroke-width="3.0" stroke-linecap="round" stroke-dasharray="193 101" filter="url(#avnl_sglow)"><animateTransform attributeName="transform" type="rotate" from="0 64 64" to="360 64 64" dur="11.0s" repeatCount="indefinite"/></circle>
  <g transform="translate(64,64) scale(0.62)">
    <text x="0" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="56" font-weight="bold" fill="url(#avnl_smain)" filter="url(#avnl_sglow)">&lt;/&gt;</text><text x="0" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="56" font-weight="bold" fill="#ffffff" opacity="0.25">&lt;/&gt;</text><circle cx="-46" cy="-44" r="3.4" fill="#22d3ee" filter="url(#avnl_sglow)"><animate attributeName="r" values="2.4;4.4;2.4" dur="2s" repeatCount="indefinite"/></circle><circle cx="40" cy="40" r="3.4" fill="#22d3ee" filter="url(#avnl_sglow)"><animate attributeName="r" values="2.4;4.4;2.4" dur="3s" repeatCount="indefinite"/></circle>
  </g>
  <g clip-path="none"><rect x="-260" y="0" width="200" height="128" fill="url(#avnl_ssweep)" transform="skewX(-18)"><animate attributeName="x" values="-260;248" dur="6.0s" begin="0s" repeatCount="indefinite"/></rect></g>
  <rect x="1" y="1" width="126" height="126" rx="29" fill="none" stroke="url(#avnl_smain)" stroke-width="1.6">
    <animate attributeName="stroke" values="#60a5fa;#22d3ee;#f472b6;#60a5fa;#60a5fa" dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>
