  <rect width="128" height="128" rx="30" fill="url(#avsc_ebg)"/>
  <circle cx="64" cy="64" r="52" fill="url(#avsc_eorb)"><animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="64" r="46" fill="none" stroke="url(#avsc_emain)" stroke-width="3.0" stroke-linecap="round" stroke-dasharray="193 101" filter="url(#avsc_eglow)"><animateTransform attributeName="transform" type="rotate" from="0 64 64" to="360 64 64" dur="11.0s" repeatCount="indefinite"/></circle>
  <g transform="translate(64,64) scale(0.62)">
    <path d="M-40,22 A40,40 0 1,1 40,22" fill="none" stroke="url(#avsc_emain)" stroke-width="7" stroke-linecap="round" filter="url(#avsc_eglow)"/><path d="M-28,10 A28,28 0 1,1 28,10" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="3 6" opacity="0.8"/><line x1="-29" y1="-29" x2="-36" y2="-33" stroke="#22d3ee" stroke-width="2.4"/><line x1="-12" y1="-44" x2="-14" y2="-51" stroke="#22d3ee" stroke-width="2.4"/><line x1="12" y1="-44" x2="14" y2="-51" stroke="#22d3ee" stroke-width="2.4"/><line x1="29" y1="-29" x2="36" y2="-33" stroke="#22d3ee" stroke-width="2.4"/><g><line x1="0" y1="8" x2="0" y2="-24" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" values="-52 0 8;52 0 8;-52 0 8" dur="5s" repeatCount="indefinite"/></line><circle cx="0" cy="8" r="6" fill="#34d399" filter="url(#avsc_eglow)"/></g>
  </g>
  <g clip-path="none"><rect x="-260" y="0" width="200" height="128" fill="url(#avsc_esweep)" transform="skewX(-18)"><animate attributeName="x" values="-260;248" dur="6.0s" begin="0s" repeatCount="indefinite"/></rect></g>
  <rect x="1" y="1" width="126" height="126" rx="29" fill="none" stroke="url(#avsc_emain)" stroke-width="1.6">
    <animate attributeName="stroke" values="#34d399;#22d3ee;#f472b6;#34d399;#34d399" dur="9s" repeatCount="indefinite"/>
  </rect>
