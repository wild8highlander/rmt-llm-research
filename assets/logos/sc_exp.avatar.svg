<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="science/experiments — animated avatar">
  <defs>
    <radialGradient id="avsc_ebg" cx="28%" cy="30%" r="110%">
      <stop offset="0%" stop-color="#141433"/>
      <stop offset="55%" stop-color="#0a0a1f"/>
      <stop offset="100%" stop-color="#04040c"/>
    </radialGradient>
    <linearGradient id="avsc_emain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"><animate attributeName="stop-color" values="#fb7185;#fbbf24;#00ffa3;#22d3ee;#a78bfa;#fb7185" dur="11s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#fbbf24"><animate attributeName="stop-color" values="#fbbf24;#a78bfa;#fb7185;#fbbf24" dur="13s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="avsc_esweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="avsc_eorb" cx="50%" cy="50%" r="50%">
