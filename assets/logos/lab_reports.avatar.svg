<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="laboratory reports — animated avatar">
  <defs>
    <radialGradient id="avlab_bg" cx="28%" cy="30%" r="110%">
      <stop offset="0%" stop-color="#141433"/>
      <stop offset="55%" stop-color="#0a0a1f"/>
      <stop offset="100%" stop-color="#04040c"/>
    </radialGradient>
    <linearGradient id="avlab_main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"><animate attributeName="stop-color" values="#fb923c;#22d3ee;#00ffa3;#22d3ee;#a78bfa;#fb923c" dur="11s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#22d3ee"><animate attributeName="stop-color" values="#22d3ee;#a78bfa;#fb923c;#22d3ee" dur="13s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="avlab_sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="avlab_orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#fb923c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <filter id="avlab_glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="avlab_soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#avlab_bg)"/>
  <circle cx="64" cy="64" r="52" fill="url(#avlab_orb)"><animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="64" r="46" fill="none" stroke="url(#avlab_main)" stroke-width="3.0" stroke-linecap="round" stroke-dasharray="193 101" filter="url(#avlab_glow)"><animateTransform attributeName="transform" type="rotate" from="0 64 64" to="360 64 64" dur="11.0s" repeatCount="indefinite"/></circle>
  <g transform="translate(64,64) scale(0.62)">
    <g><rect x="-36" y="-16" width="60" height="42" rx="4" fill="#05060f" stroke="#22d3ee" stroke-width="2.2"/><path d="M6,-16 l18,0 0,12 Z" fill="none" stroke="#22d3ee" stroke-width="2"/><line x1="-28" y1="-2" x2="10" y2="-2" stroke="#22d3ee" stroke-width="1.8" opacity="0.7"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.4s" repeatCount="indefinite"/></line><line x1="-28" y1="7" x2="5" y2="7" stroke="#22d3ee" stroke-width="1.8" opacity="0.7"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.8s" repeatCount="indefinite"/></line><line x1="-28" y1="16" x2="0" y2="16" stroke="#22d3ee" stroke-width="1.8" opacity="0.7"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.2s" repeatCount="indefinite"/></line></g><g><rect x="-24" y="-28" width="60" height="42" rx="4" fill="#05060f" stroke="#a78bfa" stroke-width="2.2"/><path d="M18,-28 l18,0 0,12 Z" fill="none" stroke="#a78bfa" stroke-width="2"/><line x1="-16" y1="-14" x2="22" y2="-14" stroke="#a78bfa" stroke-width="1.8" opacity="0.7"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.2s" repeatCount="indefinite"/></line><line x1="-16" y1="-5" x2="17" y2="-5" stroke="#a78bfa" stroke-width="1.8" opacity="0.7"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.6s" repeatCount="indefinite"/></line><line x1="-16" y1="4" x2="12" y2="4" stroke="#a78bfa" stroke-width="1.8" opacity="0.7"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="4.0s" repeatCount="indefinite"/></line></g><g><rect x="-30" y="-40" width="60" height="42" rx="4" fill="#05060f" stroke="#fb923c" stroke-width="2.2"/><path d="M12,-40 l18,0 0,12 Z" fill="none" stroke="#fb923c" stroke-width="2"/><line x1="-22" y1="-26" x2="16" y2="-26" stroke="#fb923c" stroke-width="1.8" opacity="0.7"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="4.0s" repeatCount="indefinite"/></line><line x1="-22" y1="-17" x2="11" y2="-17" stroke="#fb923c" stroke-width="1.8" opacity="0.7"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="4.4s" repeatCount="indefinite"/></line><line x1="-22" y1="-8" x2="6" y2="-8" stroke="#fb923c" stroke-width="1.8" opacity="0.7"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="4.8s" repeatCount="indefinite"/></line></g><rect x="-30" y="-52" width="60" height="14" rx="4" fill="#fb923c" opacity="0.85"><animate attributeName="y" values="-52;-44;-52" dur="3s" repeatCount="indefinite"/></rect>
  </g>
  <g clip-path="none"><rect x="-260" y="0" width="200" height="128" fill="url(#avlab_sweep)" transform="skewX(-18)"><animate attributeName="x" values="-260;248" dur="6.0s" begin="0s" repeatCount="indefinite"/></rect></g>
  <rect x="1" y="1" width="126" height="126" rx="29" fill="none" stroke="url(#avlab_main)" stroke-width="1.6">
    <animate attributeName="stroke" values="#fb923c;#22d3ee;#f472b6;#fb923c;#fb923c" dur="9s" repeatCount="indefinite"/>
  </rect>
