<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="RMT x LLM Research - Black Aurora banner">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#0d0d24"/>
      <stop offset="55%" stop-color="#070716"/>
      <stop offset="100%" stop-color="#04040c"/>
    </radialGradient>
    <linearGradient id="aurE" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#00ffa3" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00ffa3" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#22d3ee" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aurC" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aurP" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="40%" stop-color="#a78bfa" stop-opacity="0.65"/>
      <stop offset="75%" stop-color="#c084fc" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aurM" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#f472b6" stop-opacity="0"/>
      <stop offset="45%" stop-color="#f472b6" stop-opacity="0.55"/>
      <stop offset="80%" stop-color="#fb7185" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#00ffa3">
        <animate attributeName="stop-color" values="#00ffa3;#22d3ee;#a78bfa;#f472b6;#00ffa3" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#a78bfa;#f472b6;#00ffa3;#22d3ee" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#f472b6;#00ffa3;#22d3ee;#a78bfa" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#e8fff8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blurL" x="-40%" y="-120%" width="180%" height="340%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="blurM" x="-40%" y="-120%" width="180%" height="340%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="blurS" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#dff6ff">
    <circle cx="64"  cy="48"  r="1.4" class="tw a1"/><circle cx="150" cy="94"  r="1.0" class="tw a2"/>
    <circle cx="228" cy="36"  r="1.6" class="tw a3"/><circle cx="312" cy="72"  r="0.9" class="tw a2"/>
    <circle cx="398" cy="28"  r="1.3" class="tw a4"/><circle cx="482" cy="60"  r="1.0" class="tw a1"/>
    <circle cx="560" cy="24"  r="1.5" class="tw a3"/><circle cx="655" cy="52"  r="0.9" class="tw a4"/>
    <circle cx="742" cy="30"  r="1.4" class="tw a2"/><circle cx="836" cy="66"  r="1.1" class="tw a1"/>
    <circle cx="918" cy="22"  r="1.6" class="tw a3"/><circle cx="1004" cy="58" r="1.0" class="tw a2"/>
    <circle cx="1090" cy="34" r="1.3" class="tw a4"/><circle cx="1176" cy="70" r="1.5" class="tw a1"/>
    <circle cx="1236" cy="26" r="1.0" class="tw a3"/><circle cx="92" cy="150" r="0.9" class="tw a4"/>
    <circle cx="190" cy="210" r="1.1" class="tw a2"/><circle cx="1180" cy="180" r="1.2" class="tw a1"/>
    <circle cx="1105" cy="248" r="0.9" class="tw a3"/><circle cx="70" cy="262" r="1.2" class="tw a2"/>
    <circle cx="1240" cy="140" r="1.1" class="tw a4"/><circle cx="620" cy="14"  r="1.0" class="tw a2"/>
    <circle cx="980" cy="12"  r="1.2" class="tw a1"/><circle cx="300" cy="14"  r="0.9" class="tw a4"/>
  </g>

  <!-- aurora waves -->
  <g class="driftA">
    <path d="M-60,150 C180,90 340,210 560,150 C780,90 960,215 1340,140 L1340,60 C1040,120 820,20 560,80 C300,140 160,30 -60,80 Z" fill="url(#aurE)" filter="url(#blurL)" opacity="0.8">
      <animate attributeName="opacity" values="0.55;0.9;0.55" dur="11s" repeatCount="indefinite"/>
    </path>
    <path d="M-60,150 C180,90 340,210 560,150 C780,90 960,215 1340,140 L1340,60 C1040,120 820,20 560,80 C300,140 160,30 -60,80 Z" fill="url(#aurE)" filter="url(#blurM)" opacity="0.5"/>
  </g>
  <g class="driftB">
    <path d="M-60,205 C240,150 430,255 660,195 C890,140 1060,255 1340,190 L1340,110 C1080,170 900,70 660,120 C420,175 220,80 -60,130 Z" fill="url(#aurC)" filter="url(#blurL)" opacity="0.75">
      <animate attributeName="opacity" values="0.45;0.8;0.45" dur="13s" repeatCount="indefinite"/>
    </path>
  </g>
  <g class="driftC">
    <path d="M-60,255 C260,205 470,300 700,245 C930,190 1110,300 1340,240 L1340,165 C1120,225 940,125 700,170 C460,220 260,130 -60,180 Z" fill="url(#aurP)" filter="url(#blurL)" opacity="0.7">
      <animate attributeName="opacity" values="0.4;0.75;0.4" dur="15s" repeatCount="indefinite"/>
    </path>
  </g>
  <g class="driftD">
    <path d="M-60,295 C300,255 520,330 760,285 C1000,240 1150,330 1340,285 L1340,230 C1160,280 1010,195 760,230 C510,265 300,185 -60,235 Z" fill="url(#aurM)" filter="url(#blurM)" opacity="0.6">
      <animate attributeName="opacity" values="0.35;0.65;0.35" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- eigenvalue sparkle dots -->
  <g filter="url(#glowSoft)">
    <circle cx="898" cy="236" r="2.6" fill="#00ffa3" opacity="0.9"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="946" cy="252" r="2.2" fill="#22d3ee" opacity="0.8"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="992" cy="230" r="2.8" fill="#a78bfa" opacity="0.85"><animate attributeName="opacity" values="0.85;0.25;0.85" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="1042" cy="250" r="2.0" fill="#f472b6" opacity="0.8"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="1088" cy="226" r="2.4" fill="#00ffa3" opacity="0.7"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="1136" cy="246" r="2.2" fill="#22d3ee" opacity="0.8"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1182" cy="228" r="2.6" fill="#f472b6" opacity="0.75"><animate attributeName="opacity" values="0.75;0.2;0.75" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="262" r="1.6" fill="#e8fff8" opacity="0.6"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- comet -->
  <g opacity="0.9">
    <line x1="0" y1="0" x2="46" y2="0" stroke="url(#pulse)" stroke-width="2" filter="url(#glowSoft)"/>
    <circle r="2.2" fill="#e8fff8" filter="url(#glowSoft)"/>
    <animateMotion path="M 60,40 Q 420,90 760,26" dur="7s" begin="0s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.8 0.6"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.75;1" dur="7s" repeatCount="indefinite"/>
  </g>

  <!-- title -->
  <g>
    <text x="64" y="168" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="66" font-weight="800" letter-spacing="2" fill="url(#titleGrad)" filter="url(#glow)">RMT × LLM RESEARCH</text>
    <rect x="66" y="192" width="360" height="3" rx="1.5" fill="url(#titleGrad)" opacity="0.85"/>
    <text x="66" y="232" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="500" letter-spacing="4.5" fill="#b7c4d6">SPECTRAL ANALYSIS · HALLUCINATION DETECTION · COLLAPSE THEORY</text>
    <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="2">
      <rect x="66" y="252" width="150" height="26" rx="13" fill="#0b1f1a" stroke="#00ffa3" stroke-opacity="0.55"/>
      <text x="141" y="269" text-anchor="middle" fill="#7dffce">BLACK AURORA</text>
      <rect x="226" y="252" width="118" height="26" rx="13" fill="#0b1622" stroke="#22d3ee" stroke-opacity="0.55"/>
      <text x="285" y="269" text-anchor="middle" fill="#8ce7ff">8 LANGUAGES</text>
      <rect x="354" y="252" width="128" height="26" rx="13" fill="#140f26" stroke="#a78bfa" stroke-opacity="0.55">
        <animate attributeName="stroke-opacity" values="0.25;0.8;0.25" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text x="418" y="269" text-anchor="middle" fill="#cdb8ff">240+ TESTS</text>
    </g>
  </g>

  <!-- lambda emblem right -->
  <g transform="translate(1180,160)" filter="url(#glowSoft)">
    <circle r="64" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1.4" stroke-dasharray="4 7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle r="50" fill="none" stroke="#00ffa3" stroke-opacity="0.28" stroke-width="1.2">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="17s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="22" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="76" font-style="italic" fill="url(#titleGrad)">λ
      <animate attributeName="opacity" values="1;0.75;1" dur="5s" repeatCount="indefinite"/>
    </text>
  </g>

  <style>
    .tw{animation:tw 3.4s ease-in-out infinite}
    .a1{animation-delay:0s}.a2{animation-delay:-.9s}.a3{animation-delay:-1.8s}.a4{animation-delay:-2.6s}
    @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
    .driftA{animation:driftA 18s ease-in-out infinite}
    @keyframes driftA{0%,100%{transform:translate(0,0)}50%{transform:translate(34px,-12px)}}
    .driftB{animation:driftB 22s ease-in-out infinite}
    @keyframes driftB{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,10px)}}
    .driftC{animation:driftC 26s ease-in-out infinite}
    @keyframes driftC{0%,100%{transform:translate(0,0)}50%{transform:translate(26px,14px)}}
    .driftD{animation:driftD 20s ease-in-out infinite}
    @keyframes driftD{0%,100%{transform:translate(0,0)}50%{transform:translate(-24px,-8px)}}
  </style>
</svg>
