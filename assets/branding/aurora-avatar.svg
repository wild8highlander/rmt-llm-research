<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="RMT x LLM Research avatar - Black Aurora">
  <defs>
    <radialGradient id="abg" cx="50%" cy="42%" r="80%">
      <stop offset="0%" stop-color="#0e0e26"/>
      <stop offset="60%" stop-color="#070716"/>
      <stop offset="100%" stop-color="#04040c"/>
    </radialGradient>
    <linearGradient id="ring1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffa3"><animate attributeName="stop-color" values="#00ffa3;#22d3ee;#a78bfa;#f472b6;#00ffa3" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="50%" stop-color="#22d3ee"><animate attributeName="stop-color" values="#22d3ee;#a78bfa;#f472b6;#00ffa3;#22d3ee" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#f472b6"><animate attributeName="stop-color" values="#f472b6;#00ffa3;#22d3ee;#a78bfa;#f472b6" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="lam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dffce"><animate attributeName="stop-color" values="#7dffce;#8ce7ff;#cdb8ff;#ffb3dd;#7dffce" dur="9s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#a78bfa"><animate attributeName="stop-color" values="#a78bfa;#f472b6;#00ffa3;#22d3ee;#a78bfa" dur="9s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffa3" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ffa3" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <filter id="ablur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="ablur2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="aglow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="part1"><stop offset="0%" stop-color="#7dffce"/><stop offset="45%" stop-color="#7dffce" stop-opacity="0.55"/><stop offset="100%" stop-color="#7dffce" stop-opacity="0"/></radialGradient>
    <radialGradient id="part2"><stop offset="0%" stop-color="#f472b6"/><stop offset="45%" stop-color="#f472b6" stop-opacity="0.55"/><stop offset="100%" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="part3"><stop offset="0%" stop-color="#cdb8ff"/><stop offset="45%" stop-color="#cdb8ff" stop-opacity="0.55"/><stop offset="100%" stop-color="#cdb8ff" stop-opacity="0"/></radialGradient>
    <clipPath id="clipSq"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#clipSq)">
    <rect width="512" height="512" fill="url(#abg)"/>

    <!-- stars -->
    <g fill="#dff6ff">
      <circle cx="70" cy="82" r="1.8" class="tw a1"/><circle cx="150" cy="46" r="1.3" class="tw a2"/>
      <circle cx="246" cy="70" r="2.0" class="tw a3"/><circle cx="352" cy="40" r="1.4" class="tw a4"/>
      <circle cx="440" cy="88" r="1.7" class="tw a2"/><circle cx="466" cy="180" r="1.2" class="tw a1"/>
      <circle cx="52" cy="210" r="1.5" class="tw a3"/><circle cx="90" cy="330" r="1.3" class="tw a4"/>
      <circle cx="430" cy="320" r="1.8" class="tw a1"/><circle cx="470" cy="420" r="1.3" class="tw a3"/>
      <circle cx="60" cy="440" r="1.6" class="tw a2"/><circle cx="200" cy="480" r="1.2" class="tw a4"/>
      <circle cx="330" cy="486" r="1.5" class="tw a1"/><circle cx="300" cy="26" r="1.1" class="tw a2"/>
    </g>

    <!-- aurora inside avatar -->
    <g class="dA"><path d="M-20,300 C90,240 180,360 300,290 C390,240 460,340 530,290 L530,210 C440,260 380,180 280,225 C180,270 100,190 -20,240 Z" fill="url(#wave1)" filter="url(#ablur)" opacity="0.75">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="10s" repeatCount="indefinite"/></path></g>
    <g class="dB"><path d="M-20,380 C110,330 220,430 340,370 C430,330 480,410 530,370 L530,300 C440,345 380,265 280,305 C180,345 90,275 -20,320 Z" fill="url(#wave2)" filter="url(#ablur)" opacity="0.7">
      <animate attributeName="opacity" values="0.45;0.8;0.45" dur="13s" repeatCount="indefinite"/></path></g>
    <ellipse cx="256" cy="250" rx="150" ry="110" fill="#0b2b3a" opacity="0.35" filter="url(#ablur)"/>

    <!-- rotating aurora ring -->
    <g transform="translate(256,236)">
      <circle r="128" fill="none" stroke="url(#ring1)" stroke-width="7" stroke-linecap="round" stroke-dasharray="520 285" filter="url(#aglow)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle r="112" fill="none" stroke="#8ce7ff" stroke-opacity="0.25" stroke-width="1.4" stroke-dasharray="3 9">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite"/>
      </circle>
      <!-- orbiting particles -->
      <g>
        <circle cx="0" cy="-128" r="6" fill="url(#part1)"/>
        <circle cx="0" cy="-128" r="2.6" fill="#eafff6"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle cx="0" cy="128" r="5" fill="url(#part2)"/>
        <circle cx="0" cy="128" r="2.2" fill="#ffe3f0"/>
        <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="14s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle cx="112" cy="0" r="4.5" fill="url(#part3)"/>
        <circle cx="112" cy="0" r="2" fill="#f1ebff"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="9s" repeatCount="indefinite"/>
      </g>
      <!-- lambda -->
      <text x="0" y="34" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="130" font-style="italic" font-weight="700" fill="url(#lam)" filter="url(#aglow)">λ
        <animate attributeName="opacity" values="1;0.8;1" dur="5.5s" repeatCount="indefinite"/>
      </text>
      <!-- eigen dots orbit -->
      <g opacity="0.9">
        <circle cx="86" cy="54" r="2.6" fill="#00ffa3"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3s" repeatCount="indefinite"/></circle>
        <circle cx="-92" cy="40" r="2.2" fill="#22d3ee"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.8s" repeatCount="indefinite"/></circle>
        <circle cx="-64" cy="-78" r="2.8" fill="#a78bfa"><animate attributeName="opacity" values="0.85;0.2;0.85" dur="2.6s" repeatCount="indefinite"/></circle>
        <circle cx="70" cy="-84" r="2.0" fill="#f472b6"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="4.3s" repeatCount="indefinite"/></circle>
      </g>
    </g>

    <!-- wordmark -->
    <text x="256" y="452" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="800" letter-spacing="4" fill="url(#ring1)">RMT × LLM</text>
    <text x="256" y="480" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="500" letter-spacing="6" fill="#93a4bb">BLACK AURORA</text>
  </g>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="url(#ring1)" stroke-opacity="0.5" stroke-width="3"/>

  <style>
    .tw{animation:tw 3.2s ease-in-out infinite}
    .a1{animation-delay:0s}.a2{animation-delay:-.8s}.a3{animation-delay:-1.6s}.a4{animation-delay:-2.4s}
    @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
    .dA{animation:dA 16s ease-in-out infinite}
    @keyframes dA{0%,100%{transform:translate(0,0)}50%{transform:translate(18px,-10px)}}
    .dB{animation:dB 20s ease-in-out infinite}
    @keyframes dB{0%,100%{transform:translate(0,0)}50%{transform:translate(-16px,8px)}}
  </style>
</svg>
