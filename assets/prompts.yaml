# =============================================================================
# Animation slots — assets/anim/<slot>-loop.(webm|mp4) + poster in visuals/.
# All loops are seamless: every driver is a periodic function of t.
# Rules: no text inside, cubic easing, no flicker/jitter/morphing.
# =============================================================================
anims:
  hero:
    seed: 20261109
    size: [1600, 900]
    duration_s: 4
    fps: 24
    poster: hero-poster
    alt: >-
      Animated Marchenko-Pastur curve breathing while the amber BBP spike
      rises out of the bulk and violet nuclear orbitals precess
    motion_prompt: >-
      Slow, seamless loop, 4 seconds: a cyan Marchenko-Pastur density curve
      gently pulsing like a breathing wave, an amber eigenvalue spike rising
      out of the bulk in a smooth quantum transition then returning, violet
      nuclear orbital ellipses rotating slowly around a dark core, soft
      volumetric haze drifting, dark background (#05060A), cinematic lighting
      from the signal, no camera shake, no flicker, perfect loop point,
      no text, no logos

  thread-1:
    seed: 20261109
    size: [1600, 900]
    duration_s: 5
    fps: 24
    poster: thread-1-poster
    alt: >-
      Animated BBP transition: an eigenvalue leaves the Marchenko-Pastur
      bulk, rises above the critical threshold, and returns
    motion_prompt: >-
      Seamless 5s loop: cyan eigenvalue cloud forming the MP semicircle,
      one eigenvalue smoothly detaching and rising into an amber spike above
      a dashed threshold line, then rejoining; violet Tracy-Widom edge
      fluctuations shimmering along the semicircle rim; no camera movement,
