# =============================================================================
# Visual layer — single source of truth for every static and animated slot.
#
# Regenerate:
#   make images            # all static slots  -> assets/visuals/
#   make images-<slot>     # one static slot
#   make anims             # all animation slots -> assets/anim/ + posters
#   make anims-<slot>      # one animation slot
#   make og-image          # composite the OG text lockup
#
# Two providers are supported per slot:
#   provider: procedural   (default) — deterministic matplotlib/PIL renderer,
#                                      exact palette, seeded, offline, no API.
#   provider: flux|sdxl|dalle|midjourney — gen-AI prompts kept verbatim below
#                                      for external re-rendering; drop the
#                                      -raw.png next to the slot and run
#                                      `python scripts/gen_images.py --slot <slot> --from-raw`.
# =============================================================================

meta:
  project: rmt-llm-research
  concept: >-
    Model weights x nuclear levels: the LLM activation spectrum rendered as
    an atomic nucleus — the Marchenko-Pastur bulk is the noise floor, a BBP
    outlier is a quantum transition, Tracy-Widom edge fluctuations are the
    emission rim, and RLHF entropy collapse is a crimson singularity.
  static_dir: assets/visuals
  anim_dir: assets/anim
  budget:
    static_max_kb: 400
    gif_max_kb: 2048
    webm_max_kb: 3072
    visuals_dir_max_mb: 5

palette:
  background: "#05060A"   # bulk of the spectrum — near-black space
  bulk:      "#00D4FF"    # cyan   — Marchenko-Pastur noise
  spike:     "#FFB020"    # amber  — BBP signal / quantum transition
  edge:      "#B026FF"    # violet — Tracy-Widom edge fluctuations / orbitals
  collapse:  "#FF3B6B"    # crimson — RLHF entropic collapse
  text:      "#E8EEF7"    # primary contrast text (images: OG only)
  grid:      "#1A2130"    # coordinate grid / faint structure

typography:
  formulas: JetBrains Mono      # not baked into images; used in docs markup
  labels:   Inter               # OG lockup only
  fallback: DejaVu Sans Mono    # terminal recordings (cli-demo)

# No image except the OG lockup and the terminal demo carries text.
negative_prompt: >-
  text, letters, watermark, signature, logo, human faces, hands,
  photorealistic people, cartoon, anime, cluttered, low-contrast,
  lens flare, chromatic aberration, oversaturated, stock-photo style,
  3D-render plastic look, blurry, jpeg artifacts, jitter, flicker,
  temporal inconsistency, morphing artifacts

