# =============================================================================
# docker-compose.yml — orchestrates the research environment.
# Usage:
#   docker-compose up lab       # Run the Python lab (interactive menu)
#   docker-compose up webapp    # Launch the Vite + Socket.io dashboard
#   docker-compose up tests     # Run the full pytest suite
#   docker-compose up shell     # Drop into a bash shell in the container
# =============================================================================
version: "3.9"

services:
  # ─── Core research image (Python + Julia + Java) ─────────────────────────
  base:
    build:
      context: .
      dockerfile: Dockerfile
    image: rmt-llm-research:latest
    container_name: rmt-base
    volumes:
      - ./:/workspace
      - rmt-pip-cache:/home/rmtuser/.cache/pip
      - rmt-julia-depot:/opt/julia-depot
    working_dir: /workspace
    user: rmtuser
    environment:
      - PYTHONPATH=/workspace/src:/workspace/laboratory/python/lab_en
      - JULIA_DEPOT_PATH=/opt/julia-depot
      - JULIA_NUM_THREADS=auto

  # ─── Run the Python lab (EN) interactively ───────────────────────────────
  lab:
    extends: base
    container_name: rmt-lab
    stdin_open: true
    tty: true
    command: ["python", "laboratory/python/lab_en/main.py"]

  # ─── Run the Russian lab ──────────────────────────────────────────────────
  lab-ru:
    extends: base
    container_name: rmt-lab-ru
    stdin_open: true
    tty: true
    command: ["python", "laboratory/python/lab_ru/main.py"]

  # ─── Run the full pytest suite with coverage ─────────────────────────────
  tests:
    extends: base
    container_name: rmt-tests
    command: >
      pytest
      src/rmt_llm/tests/
      laboratory/python/lab_en/tests/
      --cov=rmt_llm
      --cov-report=term-missing
      --cov-report=html
      -v

  # ─── Run TinyGPT training (lab_en, menu item 14) ─────────────────────────
  tinygpt-train:
    extends: base
    container_name: rmt-tinygpt-train
    stdin_open: true
    tty: true
    command: ["python", "laboratory/python/lab_en/main.py"]

  # ─── Launch the web dashboard (Vite + Socket.io) ─────────────────────────
  webapp:
    extends: base
    container_name: rmt-webapp
    ports:
      - "5173:5173"
      - "3001:3001"
    working_dir: /workspace/laboratory/webapp
    command: ["sh", "-c", "npm install && npm start"]
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:3001

  # ─── Drop into a bash shell ──────────────────────────────────────────────
  shell:
    extends: base
    container_name: rmt-shell
    stdin_open: true
    tty: true
    entrypoint: ["/bin/bash"]
    command: []

  # ─── Documentation server (MkDocs Material — hot reload) ──────────────────
  docs:
    extends: base
    container_name: rmt-docs
    ports:
      - "8000:8000"
    working_dir: /workspace
    command: >
      sh -c "pip install -q mkdocs-material mkdocstrings[python]
      mkdocs-git-revision-date-localized-plugin mkdocs-minify-plugin
      && mkdocs serve -a 0.0.0.0:8000 --dev-addr 0.0.0.0:8000"

  # ─── Static docs build (for production deploy) ────────────────────────────
  docs-build:
    extends: base
    container_name: rmt-docs-build
    working_dir: /workspace
    command: >
      sh -c "pip install -q mkdocs-material mkdocstrings[python]
      mkdocs-git-revision-date-localized-plugin mkdocs-minify-plugin
      && mkdocs build --clean --strict
      && echo 'Docs built to site-build/'"

  # ─── Performance benchmarks (pytest-benchmark) ────────────────────────────
  bench:
    extends: base
    container_name: rmt-bench
    working_dir: /workspace/laboratory/python/lab_en
    command: >
      pytest tests/test_benchmark.py
      --benchmark-only
      --benchmark-columns=mean,stddev,ops,rounds
      -v

  # ─── Property-based tests (Hypothesis) ────────────────────────────────────
  hypothesis:
    extends: base
    container_name: rmt-hypothesis
    working_dir: /workspace/laboratory/python/lab_en
    command: >
      pytest tests/test_hypothesis.py
      --hypothesis-show-statistics
      --hypothesis-seed=0
      -v

  # ─── Security scans (bandit, pip-audit, gitleaks) ─────────────────────────
  security:
    extends: base
    container_name: rmt-security
    working_dir: /workspace
    command: >
      sh -c "pip install -q bandit pip-audit
      && bandit -r src/rmt_llm/ -ll -v
      && pip-audit --strict
      && echo 'Security scans passed'"

  # ─── Profile TinyGPT training (cProfile) ──────────────────────────────────
  profile:
    extends: base
    container_name: rmt-profile
    working_dir: /workspace/laboratory/python/lab_en
    command: >
      python -c "
      import cProfile, pstats, io;
      from tiny_gpt_trainer import train;
      from tiny_gpt import TinyGPTConfig;
      from tiny_gpt_trainer import TrainConfig, BPETokenizer;
      pr = cProfile.Profile(); pr.enable();
      cfg = TinyGPTConfig(vocab_size=128, hidden_dim=32, n_layers=1, n_heads=2, max_seq_len=16);
      tc = TrainConfig(epochs=1, learning_rate=1e-3);
      tok = BPETokenizer(vocab_size=128); tok.fit('hello world ' * 100, n_merges=16);
      train(config=cfg, train_config=tc, tokenizer=tok, corpus='hello world ' * 100, output_dir='/tmp/profile_out', verbose=False);
      pr.disable(); s = io.StringIO(); ps = pstats.Stats(pr, stream=s).sort_stats('cumulative');
      ps.print_stats(30); print(s.getvalue())
      "

  # ─── Jupyter notebook server ─────────────────────────────────────────────
  jupyter:
    extends: base
    container_name: rmt-jupyter
    ports:
      - "8888:8888"
    command: >
      jupyter notebook
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --NotebookApp.token=''
      --NotebookApp.password=''
      notebooks/

# Named volumes for caching across container rebuilds
volumes:
  rmt-pip-cache:
  rmt-julia-depot:
