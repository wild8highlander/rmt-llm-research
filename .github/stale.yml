# =============================================================================
# Stale — auto-close inactive issues and PRs to keep the backlog manageable.
# Docs: https://github.com/actions/stale
# =============================================================================
# Issues marked "pinned", "security", "roadmap", or "good first issue"
# are exempt — they stay open indefinitely.

name: Mark stale issues and pull requests

on:
  schedule:
    # Run daily at 03:17 UTC (off-peak, avoids GitHub Actions cron rush at :00)
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # ── Timing ─────────────────────────────────────────────────────────
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 14

          # ── Messages ───────────────────────────────────────────────────────
          stale-issue-message: |
            ⚠️ This issue has been automatically marked as stale because it has
            not had any activity in the last **60 days**.

            It will be closed in **14 days** unless:
            - Someone posts a comment
            - The `pinned`, `security`, or `roadmap` label is added
            - A maintainer removes the `stale` label

            Thank you for your contribution! 🙏
          close-issue-message: |
            📦 This issue was automatically closed due to inactivity.
            If this is still relevant, please reopen with a comment or open a new issue
            referencing this one. Thanks!
          stale-pr-message: |
            ⚠️ This PR has been automatically marked as stale because it has
            not had any activity in the last **30 days**.

            It will be closed in **14 days** unless there is new activity.
            If you're still working on this, push a commit or comment to keep it alive.
          close-pr-message: |
            📦 This PR was automatically closed due to inactivity.
            Feel free to reopen if you resume work on it. Thanks!

          # ── Labels ─────────────────────────────────────────────────────────
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "pinned,security,roadmap,good first issue,help wanted,dependencies"
          exempt-pr-labels: "pinned,security,dependencies,WIP"
          exempt-assignees: "wild8highlander"

          # ── Limits ─────────────────────────────────────────────────────────
          operations-per-run: 60
          remove-stale-when-updated: true
          delete-branch: false
