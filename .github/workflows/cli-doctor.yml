name: cli-doctor

# The self-healing bot: keeps the `rmt-llm-verify` CLI and the markdown
# link graph healthy. On failure it opens/updates an issue with the
# diagnostics attached, so breakage is visible the day it happens — not
# when a user hits it.

on:
  push:
    branches: [main]
    paths:
      - "src/rmt_llm/**"
      - "scripts/check_links.py"
      - "pyproject.toml"
      - "**.md"
  schedule:
    - cron: "0 5 * * *"   # daily self-check
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  cli-gate:
    name: CLI self-check (rmt-llm-verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Run the CLI gate
        id: gate
        run: |
          rmt-llm-verify info
          rmt-llm-verify verify 2>&1 | tee cli_verify.log
          python -m rmt_llm tw --s -1.5 0.5 1.5 | tee cli_tw.log
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = 'CLI log unavailable';
            try { log = fs.readFileSync('cli_verify.log', 'utf8'); } catch {}
            const title = '🤖 cli-doctor: rmt-llm-verify is failing';
            const body = [
              'The daily self-check of the `rmt-llm-verify` CLI failed.',
              '',
              '**Run:** ' + context.serverUrl + '/' + context.repo.owner + '/' +
                context.repo.repo + '/actions/runs/' + context.runId,
              '',
              '````',
              log.slice(-6000),
              '````',
              '',
              'Likely causes: a module import broke in `src/rmt_llm/`, the',
              '`__main__.py` entry point is out of sync with `cli.py`, or the',
              'console script in `pyproject.toml` points at a missing symbol.',
              'Fix locally with `pip install -e . && rmt-llm-verify verify`.',
            ].join('\n');
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'ci:cli',
            });
            if (issues.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issues.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['ci:cli', 'bug'],
              });
            }

  link-check:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check relative links
        run: python scripts/check_links.py
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🤖 cli-doctor: broken markdown links';
            const body = [
              'The relative-link check failed. Run locally:',
              '',
              '```bash',
              'python scripts/check_links.py',
              '```',
              '',
              '**Run:** ' + context.serverUrl + '/' + context.repo.owner + '/' +
                context.repo.repo + '/actions/runs/' + context.runId,
            ].join('\n');
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'ci:links',
            });
            if (issues.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issues.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['ci:links', 'docs'],
              });
            }
