# =============================================================================
# Benchmark workflow — runs pytest-benchmark on every push to main and on PRs.
# Results are uploaded as artifacts and can be compared across runs.
# =============================================================================
name: Benchmarks

on:
  push:
    branches: [main]
    paths:
      - 'src/rmt_llm/**'
      - 'laboratory/python/lab_en/**'
      - '.github/workflows/benchmark.yml'
      - 'pyproject.toml'
  pull_request:
    branches: [main]
    paths:
      - 'src/rmt_llm/**'
      - 'laboratory/python/lab_en/**'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:  # Allow manual runs
  schedule:
    # Run nightly at 03:00 UTC to track performance over time
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  benchmark:
    name: Run pytest-benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Need full history for --benchmark-compare

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,lab,bench]"
          pip install hypothesis pytest-benchmark

      - name: Run hypothesis property tests
        working-directory: laboratory/python/lab_en
        run: |
          pytest tests/test_hypothesis.py -v \
            --hypothesis-show-statistics \
            --hypothesis-seed=0 \
            --tb=short

      - name: Run benchmarks (save baseline on main)
        if: github.ref == 'refs/heads/main'
        working-directory: laboratory/python/lab_en
        run: |
          pytest tests/test_benchmark.py \
            --benchmark-only \
            --benchmark-save=main \
            --benchmark-storage=file://./.benchmarks \
            --benchmark-columns=mean,stddev,ops,rounds \
            --tb=short

      - name: Run benchmarks (compare to main on PRs)
        if: github.event_name == 'pull_request'
        working-directory: laboratory/python/lab_en
        run: |
          # First fetch the baseline from the main branch
          git fetch origin main:main || true
          # Try to compare; if no baseline exists, just save a new one
          pytest tests/test_benchmark.py \
            --benchmark-only \
            --benchmark-compare=main \
            --benchmark-storage=file://./.benchmarks \
            --benchmark-fail \
            --benchmark-columns=mean,stddev,ops,rounds \
            --tb=short || \
          pytest tests/test_benchmark.py \
            --benchmark-only \
            --benchmark-save=pr-${{ github.event.pull_request.number }} \
            --benchmark-storage=file://./.benchmarks \
            --benchmark-columns=mean,stddev,ops,rounds \
            --tb=short

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: |
            laboratory/python/lab_en/.benchmarks/
            laboratory/python/lab_en/.pytest_cache/
          retention-days: 30

      - name: Upload hypothesis statistics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hypothesis-stats-${{ github.run_id }}
          path: |
            laboratory/python/lab_en/.hypothesis/
          retention-days: 30
          if-no-files-found: ignore
