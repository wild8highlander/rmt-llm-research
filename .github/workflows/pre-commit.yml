# =============================================================================
# Pre-commit CI — runs all hooks on every push and PR, even if developers
# forgot to install them locally. Auto-fixes go in a follow-up commit.
# =============================================================================
name: Pre-commit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-pre-commit:
    name: Run all pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .pre-commit-config.yaml

      - name: Install Rust toolchain (for rust hooks)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Go (for go hooks)
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: false

      - name: Install Julia (for julia formatter)
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"

      - name: Install pre-commit
        run: |
          pip install --upgrade pip
          pip install pre-commit
          pre-commit install-hooks

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure --color=always

      - name: Upload pre-commit log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pre-commit-log
          path: |
            ~/.cache/pre-commit/
            *.log
          retention-days: 7
