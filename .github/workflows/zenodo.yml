name: Publish to Zenodo on release

# Automatically uploads the repository archive to Zenodo when a new
# GitHub Release is published. Produces a citable DOI for each release.
#
# Uses the modern Zenodo Invenio API (bucket-based file upload) which
# supports files up to 50 GB. The legacy /deposit/depositions/{id}/files
# endpoint is deprecated and returns 413 for files > ~50 MB.
#
# PREREQUISITE (one-time setup):
#   1. Sign in to https://zenodo.org with your GitHub account.
#   2. Create a Zenodo personal access token with scopes
#      "deposit:actions" + "deposit:write".
#   3. Add it as a GitHub Actions secret named ZENODO_TOKEN.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to upload (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  zenodo:
    name: Upload to Zenodo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create source archive
        id: archive
        run: |
          mkdir -p /tmp/archive
          ARCHIVE=/tmp/archive/rmt-llm-research-${{ steps.tag.outputs.tag }}.tar.gz
          git archive --format=tar.gz \
            --prefix=rmt-llm-research-${{ steps.tag.outputs.tag }}/ \
            HEAD -o "$ARCHIVE"
          ls -lh "$ARCHIVE"
          echo "path=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "filename=$(basename "$ARCHIVE")" >> "$GITHUB_OUTPUT"

      - name: Install jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq curl

      - name: Create Zenodo deposit (with retry)
        id: deposit
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$ZENODO_TOKEN" ]; then
            echo "::error::ZENODO_TOKEN secret is not set."
            exit 1
          fi

          ZENODO_API="https://zenodo.org/api/deposit/depositions"
          echo "Creating new Zenodo deposit (with retry)..."

          RESPONSE=""
          DEPOSIT_ID=""
          for ATTEMPT in 1 2 3 4 5; do
            echo "  attempt $ATTEMPT..."
            RESPONSE=$(curl -sS --max-time 60 -X POST \
              -H "Content-Type: application/json" \
              -d "{}" \
              "$ZENODO_API?access_token=$ZENODO_TOKEN") || RESPONSE=""
            DEPOSIT_ID=$(echo "$RESPONSE" | jq -r .id 2>/dev/null || echo "")
            if [ -n "$DEPOSIT_ID" ] && [ "$DEPOSIT_ID" != "null" ]; then
              break
            fi
            echo "  attempt $ATTEMPT failed; raw response (first 500 chars):"
            echo "$RESPONSE" | head -c 500
            echo ""
            sleep $((ATTEMPT * 10))
          done

          if [ -z "$DEPOSIT_ID" ] || [ "$DEPOSIT_ID" = "null" ]; then
            echo "::error::Failed to create Zenodo deposit after 5 attempts"
            exit 1
          fi
          echo "Created new deposit ID: $DEPOSIT_ID"

          # Extract bucket URL (may need to refetch deposit)
          BUCKET_URL=$(echo "$RESPONSE" | jq -r .links.bucket 2>/dev/null || echo "")
          if [ -z "$BUCKET_URL" ] || [ "$BUCKET_URL" = "null" ]; then
            echo "  bucket URL not in create response; fetching deposit..."
            RESPONSE=$(curl -sS --max-time 60 \
              "https://zenodo.org/api/deposit/depositions/$DEPOSIT_ID?access_token=$ZENODO_TOKEN")
            BUCKET_URL=$(echo "$RESPONSE" | jq -r .links.bucket 2>/dev/null || echo "")
          fi
          if [ -z "$BUCKET_URL" ] || [ "$BUCKET_URL" = "null" ]; then
            echo "::error::No bucket URL available. Raw response:"
            echo "$RESPONSE" | head -c 1000
            exit 1
          fi
          echo "Bucket URL: $BUCKET_URL"

          echo "deposit_id=$DEPOSIT_ID" >> "$GITHUB_OUTPUT"
          echo "bucket_url=$BUCKET_URL" >> "$GITHUB_OUTPUT"

      - name: Update deposit metadata
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          set -euo pipefail
          DEPOSIT_ID=${{ steps.deposit.outputs.deposit_id }}
          RELEASE_TAG=${{ steps.tag.outputs.tag }}

          METADATA=$(cat <<EOF
          {
            "metadata": {
              "title": "rmt-llm-research — Random Matrix Theory meets Large Language Models: spectral analysis of activations and the mathematical inevitability of hallucinations (${RELEASE_TAG})",
              "description": "<p>A research repository by <strong>Iskhak Hamzatovich Isaev</strong>.</p><p>Release: ${RELEASE_TAG}. Source archive uploaded for permanent citable DOI.</p><p>GitHub: <a href=\\"https://github.com/wild8highlander/rmt-llm-research\\">https://github.com/wild8highlander/rmt-llm-research</a></p>",
              "upload_type": "publication",
              "publication_type": "article",
              "version": "${RELEASE_TAG}",
              "language": "eng",
              "creators": [
                {
                  "name": "Isaev, Iskhak Hamzatovich",
                  "affiliation": "Independent researcher, Russia",
                  "orcid": "0009-0003-7299-0701"
                }
              ],
              "keywords": ["random-matrix-theory", "large-language-models", "Marchenko-Pastur", "BBP-transition", "Tracy-Widom", "non-Hermitian-skin-effect", "NHSE", "Caputo-fractional-calculus", "Keating-Snaith", "hallucinations", "RLHF", "cognitive-mode-detection", "spectral-analysis", "autoregressive-models", "mathematical-physics"],
              "license": "CC-BY-NC-SA-4.0",
              "access_right": "open",
              "related_identifiers": [
                {
                  "identifier": "https://github.com/wild8highlander/rmt-llm-research",
                  "relation": "isSupplementTo",
                  "resource_type": "software",
                  "scheme": "url"
                }
              ]
            }
          }
          EOF
          )

          echo "Updating metadata for deposit $DEPOSIT_ID..."
          HTTP_CODE=$(curl -sS -w "%{http_code}" -o /tmp/meta_response.txt \
            -X PUT \
            -H "Content-Type: application/json" \
            -d "$METADATA" \
            "https://zenodo.org/api/deposit/depositions/$DEPOSIT_ID?access_token=$ZENODO_TOKEN")
          echo "HTTP status: $HTTP_CODE"
          cat /tmp/meta_response.txt | jq . 2>/dev/null || cat /tmp/meta_response.txt
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "202" ]; then
            echo "::error::Metadata update failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Metadata updated."

      - name: Upload archive via bucket URL
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          set -euo pipefail
          BUCKET_URL=${{ steps.deposit.outputs.bucket_url }}
          ARCHIVE=${{ steps.archive.outputs.path }}
          FILENAME=${{ steps.archive.outputs.filename }}
          echo "Uploading $ARCHIVE to bucket $BUCKET_URL ..."

          HTTP_CODE=$(curl -sS -w "%{http_code}" -o /tmp/upload_response.txt \
            --max-time 600 \
            --retry 2 --retry-delay 10 \
            -X PUT \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$ARCHIVE" \
            "$BUCKET_URL/$FILENAME?access_token=$ZENODO_TOKEN")

          echo "HTTP status: $HTTP_CODE"
          cat /tmp/upload_response.txt | jq . 2>/dev/null || cat /tmp/upload_response.txt

          if [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "202" ]; then
            echo "::error::Upload failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Upload successful."

      - name: Publish Zenodo deposit
        id: publish
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          set -euo pipefail
          DEPOSIT_ID=${{ steps.deposit.outputs.deposit_id }}
          echo "Publishing Zenodo deposit $DEPOSIT_ID..."

          RESPONSE=$(curl -sS --max-time 60 \
            -X POST \
            "https://zenodo.org/api/deposit/depositions/$DEPOSIT_ID/actions/publish?access_token=$ZENODO_TOKEN")
          echo "$RESPONSE" | jq . 2>/dev/null || echo "$RESPONSE"

          DOI=$(echo "$RESPONSE" | jq -r .doi 2>/dev/null || echo "")
          if [ -z "$DOI" ] || [ "$DOI" = "null" ]; then
            echo "::error::Failed to publish deposit — DOI is null"
            exit 1
          fi
          echo "doi=$DOI" >> "$GITHUB_OUTPUT"
          echo "Published DOI: $DOI"
          echo "Zenodo DOI URL: https://doi.org/$DOI"

      - name: Summary
        if: always()
        run: |
          DOI=${{ steps.publish.outputs.doi }}
          DEPOSIT_ID=${{ steps.deposit.outputs.deposit_id }}
          {
            echo "## Zenodo upload"
            echo ""
            if [ -n "$DOI" ] && [ "$DOI" != "null" ]; then
              echo "**DOI:** [\`$DOI\`](https://doi.org/$DOI)"
              echo ""
              echo "**Zenodo record:** https://zenodo.org/record/$DEPOSIT_ID"
              echo ""
              echo "**README badge:**"
              echo "\`\`\`markdown"
              echo "[![DOI](https://img.shields.io/badge/DOI-$DOI-blue)](https://doi.org/$DOI)"
              echo "\`\`\`"
            else
              echo "Workflow did not complete. Check the failed step above."
              if [ -n "$DEPOSIT_ID" ] && [ "$DEPOSIT_ID" != "null" ]; then
                echo ""
                echo "Draft deposit (may need manual fixing): https://zenodo.org/deposit/$DEPOSIT_ID"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
