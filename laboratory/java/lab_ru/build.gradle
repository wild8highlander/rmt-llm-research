// build.gradle — RMT-LLM Laboratory (Java, RU)
// Usage: cd java/lab_ru && gradle run  OR  javac *.java && java Main

apply plugin: 'java'
apply plugin: 'application'

group = 'com.rmt.llm.lab'
version = '1.0.0'

sourceCompatibility = '17'
targetCompatibility = '17'

mainClassName = 'com.rmt.llm.lab.ru.Main'

sourceSets {
    main {
        java {
            srcDirs = ['.']
            include '*.java'
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
}

jar {
    manifest {
        attributes 'Main-Class': 'com.rmt.llm.lab.ru.Main'
    }
}

task runRu(type: JavaExec) {
    mainClass = 'com.rmt.llm.lab.ru.Main'
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
}
