plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.rmt.llm'
version = '1.3.0'

repositories {
    mavenCentral()
}

javafx {
    version = '21'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.graphics']
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
}

application {
    mainClass = 'com.rmt.llm.viz.RMTLLMVizApp'
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes(
            'Main-Class': 'com.rmt.llm.viz.RMTLLMVizApp',
            'Implementation-Title': 'RMT-LLM Visualization Suite',
            'Implementation-Version': version,
            'Implementation-Vendor': 'Iskhak Hamzatovich Isaev',
        )
    }
}

tasks.register('verify') {
    group = 'verification'
    description = 'Run headless mathematical verification checks'
    doLast {
        javaexec {
            mainClass = 'com.rmt.llm.viz.RMTVerifier'
            classpath = sourceSets.main.runtimeClasspath
        }
    }
}
