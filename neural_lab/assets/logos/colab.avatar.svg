      <stop offset="0%" stop-color="#141433"/>
      <stop offset="55%" stop-color="#0a0a1f"/>
      <stop offset="100%" stop-color="#04040c"/>
    </radialGradient>
    <linearGradient id="avcolamain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9ab00"><animate attributeName="stop-color" values="#f9ab00;#00ffa3;#00ffa3;#22d3ee;#a78bfa;#f9ab00" dur="11s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#00ffa3"><animate attributeName="stop-color" values="#00ffa3;#a78bfa;#f9ab00;#00ffa3" dur="13s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="avcolasweep" x1="0%" y1="0%" x2="100%" y2="0%">
