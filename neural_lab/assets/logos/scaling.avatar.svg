<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="scaling — animated avatar">
  <defs>
    <radialGradient id="avscalbg" cx="28%" cy="30%" r="110%">
      <stop offset="0%" stop-color="#141433"/>
      <stop offset="55%" stop-color="#0a0a1f"/>
      <stop offset="100%" stop-color="#04040c"/>
    </radialGradient>
    <linearGradient id="avscalmain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"><animate attributeName="stop-color" values="#fbbf24;#fb7185;#00ffa3;#22d3ee;#a78bfa;#fbbf24" dur="11s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#fb7185"><animate attributeName="stop-color" values="#fb7185;#a78bfa;#fbbf24;#fb7185" dur="13s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="avscalsweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="avscalorb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#fbbf24" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <filter id="avscalglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="avscalsoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#avscalbg)"/>
  <circle cx="64" cy="64" r="52" fill="url(#avscalorb)"><animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="64" r="46" fill="none" stroke="url(#avscalmain)" stroke-width="3.0" stroke-linecap="round" stroke-dasharray="193 101" filter="url(#avscalglow)"><animateTransform attributeName="transform" type="rotate" from="0 64 64" to="360 64 64" dur="11.0s" repeatCount="indefinite"/></circle>
  <g transform="translate(64,64) scale(0.62)">
    <rect x="-52" y="18" width="18" height="26" rx="5" fill="#fbbf24" opacity="0.85"><animate attributeName="height" values="18;26;18" dur="2.6s" repeatCount="indefinite"/><animate attributeName="y" values="26;18;26" dur="2.6s" repeatCount="indefinite"/><animate attributeName="fill" values="#fbbf24;#00ffa3;#fbbf24;#fbbf24" dur="7s" repeatCount="indefinite"/></rect><rect x="-24" y="0" width="18" height="44" rx="5" fill="#fb7185" opacity="0.85"><animate attributeName="height" values="36;44;36" dur="3.4000000000000004s" repeatCount="indefinite"/><animate attributeName="y" values="8;0;8" dur="3.4000000000000004s" repeatCount="indefinite"/><animate attributeName="fill" values="#fb7185;#22d3ee;#fb7185;#fb7185" dur="8s" repeatCount="indefinite"/></rect><rect x="4" y="-20" width="18" height="64" rx="5" fill="#00ffa3" opacity="0.85"><animate attributeName="height" values="56;64;56" dur="4.2s" repeatCount="indefinite"/><animate attributeName="y" values="-12;-20;-12" dur="4.2s" repeatCount="indefinite"/><animate attributeName="fill" values="#00ffa3;#a78bfa;#00ffa3;#00ffa3" dur="9s" repeatCount="indefinite"/></rect><rect x="32" y="-44" width="18" height="88" rx="5" fill="#f472b6" opacity="0.85"><animate attributeName="height" values="80;88;80" dur="5.0s" repeatCount="indefinite"/><animate attributeName="y" values="-36;-44;-36" dur="5.0s" repeatCount="indefinite"/><animate attributeName="fill" values="#f472b6;#f472b6;#f472b6;#f472b6" dur="10s" repeatCount="indefinite"/></rect><path d="M-56,26 Q-6,-2 8,-30 T56,-52" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;-48" dur="2s" repeatCount="indefinite"/></path><path d="M48,-58 L60,-50 L46,-44 Z" fill="#ffffff"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/></path>
  </g>
  <g clip-path="none"><rect x="-260" y="0" width="200" height="128" fill="url(#avscalsweep)" transform="skewX(-18)"><animate attributeName="x" values="-260;248" dur="6.0s" begin="0s" repeatCount="indefinite"/></rect></g>
  <rect x="1" y="1" width="126" height="126" rx="29" fill="none" stroke="url(#avscalmain)" stroke-width="1.6">
    <animate attributeName="stroke" values="#fbbf24;#fb7185;#f472b6;#fbbf24;#fbbf24" dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>
