<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="science — animated avatar">
  <defs>
    <radialGradient id="avsciebg" cx="28%" cy="30%" r="110%">
      <stop offset="0%" stop-color="#141433"/>
      <stop offset="55%" stop-color="#0a0a1f"/>
      <stop offset="100%" stop-color="#04040c"/>
    </radialGradient>
    <linearGradient id="avsciemain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"><animate attributeName="stop-color" values="#c084fc;#22d3ee;#00ffa3;#22d3ee;#a78bfa;#c084fc" dur="11s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#22d3ee"><animate attributeName="stop-color" values="#22d3ee;#a78bfa;#c084fc;#22d3ee" dur="13s" repeatCount="indefinite"/></stop>
    </linearGradient>
