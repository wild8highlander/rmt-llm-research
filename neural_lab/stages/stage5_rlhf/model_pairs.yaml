# =============================================================================
# Stage 5 — model pair registry: base vs tuned (SFT / RLHF / DPO) of the SAME
# family. The RLHF thesis is only testable within a family, where the
# pretraining distribution is held fixed and the tuning method varies.
#
# Fields:
#   id            — short key used in reports
#   base          — HF repo of the base model
#   tuned         — HF repo of the tuned model
#   family        — model family (must share tokenizer lineage)
#   method        — sft | rlhf | dpo | rlhf+dpo (as documented by the authors)
#   access        — open | gated (gated needs HF_TOKEN)
#   params        — approximate parameter count (for reporting)
#   chat_tuned    — whether `tuned` expects a chat template
#   notes
#
# Every pair here is REAL and exists on the HF Hub at the time of writing
# (2025); revisions are pinned by the runner at run time and written into
# the passport. Gated pairs are included for completeness; the runner skips
# them with an explicit message if no token is configured.
# =============================================================================

pairs:
  # --- Qwen2.5 family: RLHF + DPO pipeline, fully open --------------------
  - id: qwen2.5-0.5b
    base: Qwen/Qwen2.5-0.5B
    tuned: Qwen/Qwen2.5-0.5B-Instruct
    family: qwen2.5
    method: rlhf+dpo
    access: open
    params: "0.5B"
    chat_tuned: true
    notes: "Apache-2.0; instruct trained with SFT+RLHF+DPO per model card"
  - id: qwen2.5-1.5b
    base: Qwen/Qwen2.5-1.5B
    tuned: Qwen/Qwen2.5-1.5B-Instruct
    family: qwen2.5
    method: rlhf+dpo
    access: open
    params: "1.5B"
    chat_tuned: true
  - id: qwen2.5-3b
    base: Qwen/Qwen2.5-3B
    tuned: Qwen/Qwen2.5-3B-Instruct
    family: qwen2.5
    method: rlhf+dpo
    access: open
    params: "3B"
    chat_tuned: true
  - id: qwen2.5-7b
    base: Qwen/Qwen2.5-7B
    tuned: Qwen/Qwen2.5-7B-Instruct
    family: qwen2.5
    method: rlhf+dpo
    access: open
    params: "7B"
    chat_tuned: true
    notes: "float32 needs ~28GB RAM (7B * 4 bytes); use --dtype float16/bfloat16 or a GPU"

  # --- OLMo 2: fully open RLHF (allenai), 'Instruct' = DPO on RLHF --------
  - id: olmo-2-1b
    base: allenai/OLMo-2-0425-1B
    tuned: allenai/OLMo-2-0425-1B-Instruct
    family: olmo2
    method: rlhf+dpo
    access: open
    params: "1B"
    chat_tuned: true
    notes: "Apache-2.0; full RL recipe documented (Tulu 3 pipeline)"
  - id: olmo-2-7b
    base: allenai/OLMo-2-1124-7B
    tuned: allenai/OLMo-2-1124-7B-Instruct
    family: olmo2
    method: rlhf+dpo
    access: open
    params: "7B"
    chat_tuned: true

  # --- SmolLM2: DPO-only tuned pair (open) --------------------------------
  - id: smollm2-1.7b
    base: HuggingFaceTB/SmolLM2-1.7B
    tuned: HuggingFaceTB/SmolLM2-1.7B-Instruct
    family: smollm2
    method: dpo
    access: open
    params: "1.7B"
    chat_tuned: true
    notes: "instruct tuned with a DPO variant per model card; good DPO-only control"

  # --- Llama 3.x: gated, include for completeness -------------------------
  - id: llama-3.2-1b
    base: meta-llama/Llama-3.2-1B
    tuned: meta-llama/Llama-3.2-1B-Instruct
    family: llama3.2
    method: rlhf+dpo
    access: gated
    params: "1.2B"
    chat_tuned: true
    notes: "requires accepting the Meta license on HF"
  - id: llama-3.1-8b-tulu3
    base: meta-llama/Llama-3.1-8B
    tuned: allenai/Llama-3.1-Tulu-3-8B-DPO
    family: llama3.1
    method: rlhf+dpo
    access: gated
    params: "8B"
    chat_tuned: true
    notes: "Tulu 3 DPO on Llama-3.1 base; base is gated (Meta license)"

  # --- Pythia checkpoints: NOT an RLHF pair — the ablation family for the
  #     stage-3 size/checkpoint scaling (random vs trained spectra). Kept
  #     here to prevent misuse as an 'RLHF' pair.
  - id: pythia-70m-checkpoints
    base: EleutherAI/pythia-70m
    tuned: EleutherAI/pythia-70m
    base_revision: step1000
    tuned_revision: step143000
    family: pythia
    method: checkpoint-ablation
    access: open
    params: "70M"
    chat_tuned: false
    notes: "NOT RLHF: mid-training checkpoints (revision step1000 vs step143000) only"
