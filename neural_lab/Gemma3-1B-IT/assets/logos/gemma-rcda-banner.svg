    <linearGradient id="aur" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38E1C0"/>
      <stop offset=".35" stop-color="#00D4FF"/>
      <stop offset=".7" stop-color="#B026FF"/>
