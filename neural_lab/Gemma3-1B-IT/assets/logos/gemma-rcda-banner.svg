  <text x="40" y="70" fill="#8A93A6" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="12.5">probe → scans → formula-as-loss: pen = (vᵀh/‖v‖)² + hard anchor · 150 Adam steps</text>
