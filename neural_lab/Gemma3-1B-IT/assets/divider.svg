<svg xmlns="http://www.w3.org/2000/svg" width="720" height="8" viewBox="0 0 720 8" role="img" aria-label="aurora divider">
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38E1C0" stop-opacity=".1"/>
      <stop offset=".25" stop-color="#38E1C0"/>
      <stop offset=".5" stop-color="#00D4FF"/>
      <stop offset=".75" stop-color="#B026FF"/>
      <stop offset="1" stop-color="#FF6E9C" stop-opacity=".1"/>
    </linearGradient>
  </defs>
  <rect width="720" height="8" rx="4" fill="url(#d)">
    <animate attributeName="opacity" values=".7;1;.7" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
